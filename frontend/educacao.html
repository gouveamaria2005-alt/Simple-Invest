<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Educação | Simple Invest</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <header class="app-topbar">
        <a class="logo" href="dashboard.html"><span>Simple<br>Invest</span></a>
        <div class="search-top"><i data-lucide="search"></i><input placeholder="Buscar ativos (ex: PETR4, VALE3)"></div>
        <button class="avatar" title="Abrir perfil">I</button>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <a href="dashboard.html"><i data-lucide="layout-dashboard"></i>Dashboard</a>
            <a href="pesquisar.html"><i data-lucide="search"></i>Pesquisar Ativos</a>
            <a href="favoritos.html"><i data-lucide="star"></i>Favoritos</a>
            <a href="carteira.html"><i data-lucide="wallet"></i>Carteira</a>

            <a href="noticias.html"><i data-lucide="newspaper"></i>Notícias</a>
            <a href="ia.html"><i data-lucide="bot"></i>IA Financeira</a>
            <a href="perfil.html"><i data-lucide="user"></i>Perfil</a>

                <strong>Dica educativa</strong>
                <p>Conteúdo escrito em linguagem simples para investidores iniciantes.</p>
            </div>
        </aside>

        <main class="app-main">
            <h1>Conteúdo Educacional</h1>
            <p class="muted">Glossário pesquisável com conceitos para investidores iniciantes.</p>

            <div class="big-search compact-search">
                <i data-lucide="search"></i>
                <input id="buscaEducacao" placeholder="Pesquisar: previdência, aporte, liquidar, comprar, vender...">
            </div>

            <section class="content-grid" id="listaEducacao"></section>
        </main>
    </div>

    <script src="js/script.js"></script>
    <script>
        lucide.createIcons();
        renderEducacao();
    </script>

</html>
